[project]
name = "budget-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dantegreen213", email = "dantegreen213@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.142.4",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
budget-api = "budget_api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
